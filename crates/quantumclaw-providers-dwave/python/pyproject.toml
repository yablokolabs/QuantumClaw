[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumclaw-dwave"
version = "0.1.1"
description = "D-Wave Ocean bridge for the QuantumClaw agent runtime"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yabloko Labs" }]
keywords = ["quantum", "optimization", "qubo", "dwave", "ocean", "annealing", "quantumclaw"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yablokolabs/QuantumClaw"
Repository = "https://github.com/yablokolabs/QuantumClaw"
Documentation = "https://github.com/yablokolabs/QuantumClaw/blob/main/docs/providers/dwave.md"
Issues = "https://github.com/yablokolabs/QuantumClaw/issues"

[project.optional-dependencies]
# Local classical samplers only: simulated annealing and exhaustive search.
# No cloud client, no credentials, no paid resources.
local = ["dimod>=0.12", "dwave-samplers>=1.3"]
# Everything above plus the Leap cloud client, QPU sampler and embedding tools.
dwave = ["dwave-ocean-sdk>=8"]
test = ["pytest>=7"]

[project.scripts]
quantumclaw-dwave-bridge = "quantumclaw_dwave.bridge:main"

[tool.setuptools]
packages = ["quantumclaw_dwave"]
